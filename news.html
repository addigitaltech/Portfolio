<script>
var Q=new URLSearchParams(location.search),slug=Q.get('s'),cat=Q.get('c')||'',off=0,L=9,A=ADNews,$=function(i){return document.getElementById(i)};
function api(q){return fetch('api/posts.php?'+q).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'x');return j})})}
function chips(cs){var c=$('chips');c.textContent='';['']. concat(cs).forEach(function(n){var b=document.createElement('button');b.type='button';b.textContent=n||'All';b.setAttribute('aria-pressed',n===cat);b.onclick=function(){location.search=n?'?c='+encodeURIComponent(n):''};c.appendChild(b)})}
function list(){$('artv').hidden=true;api('limit='+L+'&offset='+off+(cat?'&category='+encodeURIComponent(cat):'')).then(function(j){
if(!off)chips(j.categories||[]);var g=$('grid');j.posts.forEach(function(p,i){g.appendChild(A.card(p,!off&&i===0&&!cat))});off+=j.posts.length;
$('state').textContent=off?'':'No news published yet.';$('more').hidden=off>=j.total}).catch(function(){$('state').textContent='News is unavailable right now. Please try again later.'})}
function article(){$('listv').hidden=true;var a=$('artv');a.hidden=false;api('slug='+encodeURIComponent(slug)).then(function(j){var p=j.post;document.title=p.title+' | AD Digital Tech';
var d=document.querySelector('meta[name=description]');if(d)d.content=p.summary;
var back=A.el('a','\u2190 All news');back.href='news.html';a.appendChild(back);var tg=A.el('div',p.category,'tag');tg.style.marginTop='24px';a.appendChild(tg);a.appendChild(A.el('h1',p.title));
a.appendChild(A.el('time',A.fmt(p.published_at),'mut'));var im=A.cover(p);if(im)a.appendChild(im);
String(p.body).split(/\n{2,}/).forEach(function(x){if(x.trim())a.appendChild(A.el('p',x.trim()))});
if(p.link_url&&/^https?:\/\//i.test(p.link_url)){var l=A.el('a','Read the source','btn p');l.href=p.link_url;l.target='_blank';l.rel='noopener';a.appendChild(l)}}).catch(function(){a.appendChild(A.el('p','This story could not be found.','ghost'));var b=A.el('a','Back to news');b.href='news.html';a.appendChild(b)})}
$('more').onclick=list;if(slug)article();else list();
</script></body></html>
